<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Éditeur — Connect</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/admin/brand.css?v=connect-1"><link rel="stylesheet" href="/admin/editor.css?v=connect-1"></head><body>
<div id="connect-bar"><a class="editor-brand" href="/admin/"><img src="/logo.png" alt=""><strong>Connect</strong></a><a class="back-pages" href="/admin/">← Les pages</a><span id="current-page">Édition</span><button id="mobile-view" type="button">Aperçu</button><a class="view-site" href="/" target="_blank" rel="noopener">Voir le site ↗</a></div>
<p id="loading">Chargement de l’éditeur…</p>
<script>window.CMS_MANUAL_INIT=true;</script><script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
<script type="module">
import {registerPreviews} from '/admin/previews.js?v=connect-1';
try {
 const responses=await Promise.all([fetch('/admin/config.yml',{cache:'no-store'}),fetch('/admin/preview-data.json',{cache:'no-store'})]);
 if(responses.some(r=>!r.ok))throw Error('Configuration indisponible');
 const [config,pages]=await Promise.all(responses.map(r=>r.json()));
 const labelWithoutNumber=value=>value.replace(/^\d+\s*·\s*/, '');
 for(const collection of config.collections){collection.label=labelWithoutNumber(collection.label);for(const file of collection.files){for(const field of file.fields)field.label=labelWithoutNumber(field.label);}}
 const showPage=()=>{const id=location.hash.split('/').at(-1);const page=pages.find(p=>p.id===id);document.getElementById('current-page').textContent=page?.label||'Édition';};
 showPage();window.addEventListener('hashchange',showPage);
 registerPreviews(pages);
 CMS.init({config:{...config,load_config_file:false}});
 document.getElementById('loading').remove();
} catch { document.getElementById('loading').textContent='Chargement impossible. Actualisez la page. Si le problème persiste, vérifiez le dernier déploiement Vercel.'; }
const button=document.getElementById('mobile-view');
button.onclick=()=>{const active=document.body.classList.toggle('connect-preview');button.textContent=active?'Modifier':'Aperçu';button.setAttribute('aria-pressed',String(active));};
window.addEventListener('hashchange',()=>{document.body.classList.remove('connect-preview');button.textContent='Aperçu';});
</script></body></html>
